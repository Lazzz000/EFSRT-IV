<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión | Minimarket</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500">

<!-- Card -->
<div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8">

    <!-- Logo / Título -->
    <div class="text-center mb-6">
        <div class="text-5xl text-indigo-600 mb-2">
            <i class="bi bi-shop"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-800">Minimarket</h1>
        <p class="text-gray-500 mt-1">Sistema de Gestión</p>
    </div>

    <!-- Form -->
	<form th:action="@{/login}" method="post" class="space-y-5">

	    <div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded relative text-sm text-center mb-4">
	        <span>Usuario o contraseña incorrectos.</span>
	    </div>

	    <div th:if="${param.logout}" class="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-2 rounded relative text-sm text-center mb-4">
	        <span>Has cerrado sesión correctamente.</span>
	    </div>

	    <div>
	        <label class="block text-sm font-medium text-gray-700 mb-1">
	            Usuario
	        </label>
	        <div class="relative">
	            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
	                <i class="bi bi-person-fill"></i>
	            </span>
	            <input type="text"
	                   name="username"
	                   required
	                   placeholder="Ingrese su usuario"
	                   class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
	        </div>
	    </div>

	    <div>
	        <label class="block text-sm font-medium text-gray-700 mb-1">
	            Contraseña
	        </label>
	        <div class="relative">
	            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
	                <i class="bi bi-lock-fill"></i>
	            </span>
	            <input type="password"
	                   name="password"
	                   required
	                   placeholder="Ingrese su contraseña"
	                   class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
	        </div>
	    </div>

	    <button type="submit"
	            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-semibold transition duration-300 flex items-center justify-center gap-2">
	        <i class="bi bi-box-arrow-in-right"></i>
	        Iniciar sesión
	    </button>
	</form>

    <!-- Footer -->
    <div class="text-center mt-6 text-sm text-gray-400">
        © 2026 Minimarket · Proyecto académico
    </div>
</div>

</body>
</html>
