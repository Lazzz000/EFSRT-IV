<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div>
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Productos</h1>

        <button onclick="openCreateModal()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
            + Nuevo producto
        </button>
    </div>

    <!-- TABLA -->
    <div class="bg-white rounded-xl shadow overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-gray-100">
            <tr>
                <th class="p-3">ID</th>
                <th class="p-3">Nombre</th>
                <th class="p-3">Precio</th>
                <th class="p-3">Stock</th>
                <th class="p-3 text-center">Acciones</th>
            </tr>
            </thead>
			
			<!--recorro y lleno la tabla con la lista productos-->
			<tbody>
				<tr th:each="p : ${productos}" class="border-t">
				    <td class="p-3" th:text="${p.id}">1</td>
				    <td class="p-3" th:text="${p.nombre}">Nombre Demo</td>
				    <td class="p-3" th:text="${'S/ ' + p.precio}">S/ 0.00</td>
				    <td class="p-3" th:text="${p.stockActual}">0</td>
				    <td class="p-3 flex justify-center gap-2">
				        <button type="button"
				                th:data-id="${p.id}"
				                th:data-nombre="${p.nombre}"
				                th:data-precio="${p.precio}"
				                th:data-stock="${p.stockActual}"
				                onclick="openEditModal(this)"
				                class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded">
				            Editar
				        </button>
				        <a th:href="@{/productos/eliminar/{id}(id=${p.id})}" 
				           class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded"
				           onclick="return confirm('¿Estás seguro de eliminar este producto?')">
				            Eliminar
				        </a>
				    </td>
				</tr>
			</tbody>
			
        </table>
    </div>
</div>

<!-- MODAL -->
<div id="productModal"
     class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">

    <div class="bg-white w-full max-w-lg rounded-xl shadow-lg p-6 relative">

        <h2 id="modalTitle" class="text-xl font-bold mb-4">
            Nuevo producto
        </h2>

        <form id="productForm" class="space-y-4">

            <input type="hidden" id="productId">

            <div>
                <label class="block text-gray-600 mb-1">Nombre</label>
                <input type="text" id="nombre"
                       class="w-full border px-3 py-2 rounded-lg">
            </div>

            <div>
                <label class="block text-gray-600 mb-1">Precio</label>
                <input type="number" step="0.01" id="precio"
                       class="w-full border px-3 py-2 rounded-lg">
            </div>

            <div>
                <label class="block text-gray-600 mb-1">Stock</label>
                <input type="number" id="stock"
                       class="w-full border px-3 py-2 rounded-lg">
            </div>

            <div class="flex justify-end gap-3 pt-4">
                <button type="button"
                        onclick="closeModal()"
                        class="px-4 py-2 rounded-lg bg-gray-300 hover:bg-gray-400">
                    Cancelar
                </button>

                <button type="submit"
                        class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white">
                    Guardar
                </button>
            </div>

        </form>

    </div>
</div>

<!-- JS -->
<script>
    const modal = document.getElementById('productModal');
    const modalTitle = document.getElementById('modalTitle');

    function openCreateModal() {
        modalTitle.innerText = 'Nuevo producto';
        document.getElementById('productForm').reset();
        document.getElementById('productId').value = '';
        modal.classList.remove('hidden');
    }

	function openEditModal(btn) {
	    // Extraemos los datos del atributo data-* del botón recibido
	    const id = btn.getAttribute('data-id');
	    const nombre = btn.getAttribute('data-nombre');
	    const precio = btn.getAttribute('data-precio');
	    const stock = btn.getAttribute('data-stock');

	    modalTitle.innerText = 'Editar producto';
	    document.getElementById('productId').value = id;
	    document.getElementById('nombre').value = nombre;
	    document.getElementById('precio').value = precio;
	    document.getElementById('stock').value = stock;
	    modal.classList.remove('hidden');
	}

    function closeModal() {
        modal.classList.add('hidden');
    }
</script>

</body>
</html>
